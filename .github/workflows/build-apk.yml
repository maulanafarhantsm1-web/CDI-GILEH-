name: Build CDI GILEH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p app-source
          unzip -o CDI_GILEH_APK_GITHUB.zip -d app-source

      - name: Find project
        run: |
          echo "Isi source:"
          find app-source -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          cd app-source
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CDI-GILEH-APK
          path: app-source/**/build/outputs/apk/**/*.apk
